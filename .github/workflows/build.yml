name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Windows (WVC.zip)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build x64 (app + camera DLL)
        run: |
          cmake -S . -B build64 -A x64
          cmake --build build64 --config Release

      - name: Build x86 (camera DLL for 32-bit apps)
        run: |
          cmake -S . -B build32 -A Win32
          cmake --build build32 --config Release

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/WVC | Out-Null
          Copy-Item build64/bin/Release/WVC.exe dist/WVC/
          Copy-Item build64/bin/Release/WVCCam.dll dist/WVC/
          Copy-Item build32/bin/Release/WVCCam32.dll dist/WVC/
          Copy-Item docs/README-RU.txt dist/WVC/README.txt
          Copy-Item docs/PHONE-PROTOCOL.md dist/WVC/PHONE-PROTOCOL.md
          Copy-Item third_party/softcam/LICENSE dist/WVC/LICENSE-softcam.txt
          # adb for the phone over USB (Android SDK Platform-Tools; license in adb/NOTICE.txt)
          Invoke-WebRequest -Uri https://dl.google.com/android/repository/platform-tools-latest-windows.zip -OutFile pt.zip
          Expand-Archive pt.zip -DestinationPath pt -Force
          New-Item -ItemType Directory -Force dist/WVC/adb | Out-Null
          foreach ($f in 'adb.exe','AdbWinApi.dll','AdbWinUsbApi.dll','NOTICE.txt','source.properties') {
            Copy-Item "pt/platform-tools/$f" dist/WVC/adb/ -ErrorAction Stop
          }
          Get-ChildItem dist/WVC -Recurse | Select-Object FullName, Length | Format-Table -AutoSize
          Compress-Archive -Path dist/WVC -DestinationPath dist/WVC.zip -Force

      - uses: actions/upload-artifact@v4
        with:
          name: WVC
          path: dist/WVC

      - uses: actions/upload-artifact@v4
        with:
          name: WVC-zip
          path: dist/WVC.zip

  android:
    name: Android (WVC-Phone.apk)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: android
        run: gradle --no-daemon assembleDebug

      - name: Rename
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/WVC-Phone.apk
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: WVC-Phone
          path: dist/WVC-Phone.apk

  release:
    name: Publish "latest" release
    needs: [build, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: WVC-zip
          path: dist

      - uses: actions/download-artifact@v4
        with:
          name: WVC-Phone
          path: dist

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          ls -la dist
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest dist/WVC.zip dist/WVC-Phone.apk --prerelease --target "$GITHUB_SHA" \
            --title "WVC — сборка $GITHUB_RUN_NUMBER" \
            --notes "Автоматическая сборка из коммита ${GITHUB_SHA::7}. WVC.zip — программа для Windows (с adb для телефона по USB), WVC-Phone.apk — приложение для Android (телефон как камера)."
